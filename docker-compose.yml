services:
  db:
    image: postgres:17-alpine
    container_name: agendamento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salao_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agendamento}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Porta afastada no host (55432) para não conflitar com um Postgres local na 5432
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
